name: Build Dr Patil Digital OPD V25 - PDF Generation Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate the exact V25 source
        shell: bash
        run: |
          set -euo pipefail
          test -s DrPatil_Digital_OPD_V25_Final.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('DrPatil_Digital_OPD_V25_Final.html')
          s=p.read_text(encoding='utf-8')
          required=['id="print"','id="share"','id="printFollowup"','id="printArea"','window.print()','data-print-fu','data-direct-preview','data-preop-preview','exportCompleteBackup','dpod_records','dpod_followups','dpod_medicine_library','dpod_settings','dpod_preoperative_patients','dpod_reference_doctor_library','function printWithMode(mode, data, follow=false)','window.__opdPreviousDocumentTitle']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('V25 source validation failed: '+', '.join(missing))
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='98596759e34163ef68ce67cd9a557a71137c9243170b7c32e73c6ccce8805c5e'
          if actual!=expected: raise SystemExit('V25 final source checksum mismatch: '+actual)
          print('V25 final source checksum verified:',actual)
          print('V25 bytes:',p.stat().st_size)
          print('All New Consultation, Follow-up, Patient Records and Pre-op print routes verified.')
          PY

      - name: Prepare V25 and install local PDF generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cp DrPatil_Digital_OPD_V25_Final.html www/index.html
          cat > package.json <<'JSON'
          {"name":"dr-patil-digital-opd","version":"1.0.0","private":true}
          JSON
          npm install --no-audit --no-fund @capacitor/core@6.1.2 @capacitor/android@6.1.2
          npm install --no-audit --no-fund --save-dev @capacitor/cli@6.1.2
          npm install --no-audit --no-fund html2canvas@1.4.1 jspdf@2.5.2
          test -s node_modules/html2canvas/dist/html2canvas.min.js
          test -s node_modules/jspdf/dist/jspdf.umd.min.js
          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/jspdf.umd.min.js
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.drpatil.digitalopd","appName":"Dr Patil Digital OPD","webDir":"www"}
          JSON
          npx cap add android
          npx cap sync android

      - name: Configure Android PDF FileProvider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths><cache-path name="shared_pdfs" path="shared-pdfs/" /></paths>
          XML
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text(encoding='utf-8')
          if 'androidx.core.content.FileProvider' not in s:
            provider='''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
            '''
            if '</application>' not in s: raise SystemExit('AndroidManifest application tag missing')
            m.write_text(s.replace('</application>',provider+'\n</application>',1),encoding='utf-8')
          g=Path('android/app/build.gradle')
          s=g.read_text(encoding='utf-8')
          if 'androidx.core:core:' not in s:
            if 'dependencies {' not in s: raise SystemExit('Gradle dependencies block missing')
            g.write_text(s.replace('dependencies {',"dependencies {\n    implementation 'androidx.core:core:1.13.1'",1),encoding='utf-8')
          assert 'androidx.core.content.FileProvider' in m.read_text(encoding='utf-8')
          assert 'shared_pdfs' in Path('android/app/src/main/res/xml/file_paths.xml').read_text()
          print('FileProvider configuration verified.')
          PY

      - name: Add native Android PDF creation and sharing bridge
        shell: bash
        run: |
          set -euo pipefail
          D=android/app/src/main/java/com/drpatil/digitalopd
          mkdir -p "$D"
          cat > "$D/MainActivity.java" <<'JAVA'
          package com.drpatil.digitalopd;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;

          public class MainActivity extends BridgeActivity {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean installed = false;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  handler.postDelayed(() -> installBridge(0), 300);
              }
              private void installBridge(int attempt) {
                  if (installed) return;
                  WebView view = bridge == null ? null : bridge.getWebView();
                  if (view == null) {
                      if (attempt < 80) handler.postDelayed(() -> installBridge(attempt + 1), 250);
                      else Toast.makeText(this,"Android PDF bridge failed to initialise.",Toast.LENGTH_LONG).show();
                      return;
                  }
                  view.addJavascriptInterface(new NativePdfBridge(this,view),"AndroidPrint");
                  installed = true;
                  view.postDelayed(view::reload,500);
              }
              public static final class NativePdfBridge {
                  private final MainActivity activity;
                  private final WebView webView;
                  private final Handler main = new Handler(Looper.getMainLooper());
                  NativePdfBridge(MainActivity a,WebView w){activity=a;webView=w;}
                  @JavascriptInterface public String ping(){return "DR_PATIL_PDF_BRIDGE_READY_V2";}
                  @JavascriptInterface public void print(){main.post(()->{
                      try {
                          PrintManager pm=(PrintManager)activity.getSystemService(Context.PRINT_SERVICE);
                          if(pm==null)throw new IllegalStateException("Android Print service unavailable");
                          String job="Dr Patil Digital OPD";
                          PrintAttributes attrs=new PrintAttributes.Builder()
                              .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                              .setResolution(new PrintAttributes.Resolution("opd300","OPD 300 DPI",300,300))
                              .setMinMargins(PrintAttributes.Margins.NO_MARGINS).build();
                          pm.print(job,webView.createPrintDocumentAdapter(job),attrs);
                          notifyPage("Android print dialog opened.",false);
                      } catch(Exception e){fail("Print dialog failed: "+err(e));}
                  });}
                  @JavascriptInterface public void sharePdf(String encoded,String patient){main.post(()->saveAndShare(encoded,patient));}
                  private void saveAndShare(String encoded,String patient){
                      File file=null;
                      try {
                          if(encoded==null||encoded.length()<1000)throw new IllegalArgumentException("PDF data is empty");
                          byte[] data=Base64.decode(encoded,Base64.DEFAULT);
                          if(data.length<500||data[0]!='%'||data[1]!='P'||data[2]!='D'||data[3]!='F')throw new IllegalArgumentException("Generated data is not a valid PDF");
                          File dir=new File(activity.getCacheDir(),"shared-pdfs");
                          if(!dir.exists()&&!dir.mkdirs())throw new IOException("Cannot create PDF cache folder");
                          String safe=(patient==null||patient.trim().isEmpty())?"Patient":patient.trim().replaceAll("[^a-zA-Z0-9._-]","_");
                          if(safe.length()>50)safe=safe.substring(0,50);
                          file=new File(dir,"DrPatil_"+safe+"_"+System.currentTimeMillis()+".pdf");
                          try(FileOutputStream out=new FileOutputStream(file)){out.write(data);out.flush();out.getFD().sync();}
                          if(!file.isFile()||file.length()!=data.length)throw new IOException("PDF was not completely written");
                          Uri uri=FileProvider.getUriForFile(activity,activity.getPackageName()+".fileprovider",file);
                          Intent send=new Intent(Intent.ACTION_SEND).setType("application/pdf");
                          send.putExtra(Intent.EXTRA_STREAM,uri);
                          send.setClipData(ClipData.newUri(activity.getContentResolver(),file.getName(),uri));
                          send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          Intent chooser=Intent.createChooser(send,"Share patient PDF");
                          chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          activity.startActivity(chooser);
                          notifyPage("PDF file created. Choose WhatsApp, WhatsApp Business or Save to Files.",false);
                      } catch(Exception e){if(file!=null&&file.exists())file.delete();fail("PDF creation/sharing failed: "+err(e));}
                  }
                  private String err(Exception e){return e.getClass().getSimpleName()+": "+String.valueOf(e.getMessage());}
                  private void fail(String msg){notifyPage(msg,true);Toast.makeText(activity,msg,Toast.LENGTH_LONG).show();}
                  private void notifyPage(String msg,boolean error){String q=JSONObject.quote(msg);webView.post(()->webView.evaluateJavascript("if(window.__drPatilPdfStatus){window.__drPatilPdfStatus("+q+","+error+");}",null));}
              }
          }
          JAVA

      - name: Connect all V25 digital PDF buttons to flattened A4 PDF generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="dr-patil-pdf-generator-v3"' in s: raise SystemExit('Duplicate flattened PDF injection')
          tags='<script src="html2canvas.min.js"></script>\n<script src="jspdf.umd.min.js"></script>\n'
          if '</head>' not in s or '</body>' not in s: raise SystemExit('V25 document structure incomplete')
          s=s.replace('</head>',tags+'</head>',1)
          bridge=r'''<script id="dr-patil-pdf-generator-v3">
          (function(){
            "use strict";
            var state="checking",badge=null,attempts=0,timer=null,busy=false;
            function show(message,isError){try{if(!document.body)return;if(!badge){badge=document.createElement('div');badge.id='dr-patil-pdf-status';badge.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;padding:10px 12px;border-radius:9px;color:#fff;font:13px/1.4 system-ui,sans-serif;box-shadow:0 2px 12px #0005;display:none;text-align:center';document.body.appendChild(badge);}badge.textContent=message;badge.style.background=isError?'#9b1c1c':'#245b42';badge.style.display='block';}catch(e){}}
            window.__drPatilPdfStatus=show;
            function getJsPDF(){return window.jspdf&&window.jspdf.jsPDF;}
            function diagnostics(){var c=typeof window.html2canvas==='function',j=typeof getJsPDF()==='function',a=!!window.AndroidPrint,p=false;try{p=!!(a&&typeof AndroidPrint.ping==='function'&&AndroidPrint.ping()==='DR_PATIL_PDF_BRIDGE_READY_V2');}catch(e){}window.__drPatilPdfDiagnostics={javascriptLoaded:true,html2canvasLoaded:c,jspdfLoaded:j,androidObjectPresent:a,androidPingReady:p};return window.__drPatilPdfDiagnostics;}
            function collectV25PrintStyles(){var out=[];function visit(rules,inside){for(var i=0;i<rules.length;i++){var r=rules[i];if(r.type===CSSRule.MEDIA_RULE){var mt=(r.conditionText||(r.media&&r.media.mediaText)||'').toLowerCase();visit(r.cssRules,inside||/(^|,)\s*print\b/.test(mt));}else if(inside&&r.type!==CSSRule.PAGE_RULE)out.push(r.cssText);}}Array.prototype.forEach.call(document.styleSheets,function(sh){try{visit(sh.cssRules,false);}catch(e){}});if(!out.length)throw new Error('Original V25 A4 print stylesheet could not be loaded');return out.join('\n');}
            show('PDF diagnostic: checking flattened PDF libraries and Android service…',false);
            function connect(){try{if(!(window.AndroidPrint&&typeof AndroidPrint.ping==='function'&&AndroidPrint.ping()==='DR_PATIL_PDF_BRIDGE_READY_V2'&&typeof AndroidPrint.print==='function'&&typeof AndroidPrint.sharePdf==='function'&&typeof window.html2canvas==='function'&&typeof getJsPDF()==='function'))return false;
              state='connected';window.__drPatilPdfBridgeState=state;
              window.print=function(){if(busy){show('PDF is being created. Please wait.',false);return;}var area=document.getElementById('printArea'),page=area&&area.querySelector('.letter-page');if(!page){show('Patient document was not found in the print area.',true);return;}
                if((window._opdPrintMode||'digital')==='physical'){show('Opening print dialog for pre-printed letterhead…',false);try{AndroidPrint.print();}catch(e){show('Physical printing failed: '+e,true);}finally{window._opdPrintMode='digital';}return;}
                busy=true;show('Creating flattened A4 patient PDF…',false);var oldArea=area.getAttribute('style'),oldPage=page.getAttribute('style'),css=document.createElement('style');css.id='dr-patil-pdf-layout-v3';
                (async function(){try{css.textContent=collectV25PrintStyles();document.head.appendChild(css);area.style.cssText+=';display:block;position:fixed;left:0;top:0;z-index:2147483000;width:210mm;margin:0;padding:0;background:#fff;opacity:1;pointer-events:none';page.style.cssText+=';opacity:1;visibility:visible;display:block;width:210mm;height:297mm;margin:0;transform:none';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));if(document.fonts&&document.fonts.ready)await document.fonts.ready;
                  var bg=page.querySelector('.letter-bg');if(bg){if(!bg.complete)await new Promise((r,j)=>{bg.onload=r;bg.onerror=()=>j(new Error('Letterhead image failed to load'));});if(bg.decode)await bg.decode();}
                  var clinical=page.querySelector('.letter-clinical');if(!clinical)throw new Error('Clinical note area is missing');var fs=8.8;while(clinical.scrollHeight>clinical.clientHeight+1&&fs>7){fs=Math.max(7,fs-.2);clinical.style.fontSize=fs+'pt';clinical.querySelectorAll('p,h3').forEach(n=>n.style.fontSize=(fs+(n.tagName==='H3'?.1:0))+'pt');}if(clinical.scrollHeight>clinical.clientHeight+2)throw new Error('Note is too long for the letterhead writing area');
                  var canvas=await html2canvas(page,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#fff',logging:false,scrollX:0,scrollY:0,windowWidth:Math.max(document.documentElement.clientWidth,794),windowHeight:Math.max(document.documentElement.clientHeight,1123)});if(!canvas||canvas.width<500||canvas.height<700)throw new Error('Prescription page capture failed');var data=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,nonwhite=0,step=Math.max(4,Math.floor(data.length/20000/4)*4);for(var i=0;i<data.length;i+=step){if(data[i]<245||data[i+1]<245||data[i+2]<245){nonwhite++;if(nonwhite>20)break;}}if(nonwhite<10)throw new Error('Captured prescription is blank; PDF was not shared');
                  var img=canvas.toDataURL('image/jpeg',.96);if(img.length<10000)throw new Error('Captured page image is empty');var PDF=getJsPDF(),pdf=new PDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});pdf.addImage(img,'JPEG',0,0,210,297,undefined,'FAST');if(pdf.internal.getNumberOfPages()!==1)throw new Error('PDF is not exactly one A4 page');var uri=pdf.output('datauristring'),comma=uri.indexOf(',');if(comma<0)throw new Error('Invalid PDF data');var base64=uri.substring(comma+1);if(base64.length<10000)throw new Error('PDF output is empty');var nm=page.querySelector('.letter-patient .name'),patient=nm?nm.textContent.trim():'Patient';window.__drPatilLastPdfDiagnostics={width:canvas.width,height:canvas.height,nonWhitePixelSampleCount:nonwhite,pdfPages:1,base64Length:base64.length};show('Flattened PDF generated. Opening share options…',false);AndroidPrint.sharePdf(base64,patient||'Patient');
                }catch(e){show('PDF creation failed: '+(e&&e.message?e.message:String(e)),true);alert('Could not create patient PDF: '+(e&&e.message?e.message:String(e)));}finally{if(oldArea===null)area.removeAttribute('style');else area.setAttribute('style',oldArea);if(oldPage===null)page.removeAttribute('style');else page.setAttribute('style',oldPage);if(css.parentNode)css.remove();busy=false;}})();};
              show('PDF diagnostic: flattened PDF scripts and Android bridge connected.',false);return true;}catch(e){show('PDF bridge error: '+e,true);return false;}}
            window.__drPatilPdfBridgeState=state;window.print=function(){show('Android PDF service is not connected. Close and reopen the app.',true);};
            function start(){var d=diagnostics();if(connect())return;var n=0;if(timer)return;timer=setInterval(function(){n++;if(connect()||n>=100){clearInterval(timer);timer=null;if(n>=100&&window.__drPatilPdfBridgeState!=='connected')show('PDF service or required PDF library did not connect.',true);}},250);}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();document.addEventListener('visibilitychange',function(){if(!document.hidden&&state!=='connected')start();});
          })();
          </script>'''

          s=s.replace('</body>',bridge+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          checks=['src="html2canvas.min.js"','src="jspdf.umd.min.js"','id="dr-patil-pdf-generator-v3"','html2canvas(page',"pdf.addImage(img,'JPEG',0,0,210,297",'AndroidPrint.sharePdf(base64','AndroidPrint.print()','id="print"','id="share"','id="printFollowup"','data-print-fu','data-direct-preview','data-preop-preview']
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('Flattened PDF bridge verification failed: '+', '.join(missing))
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.I|re.S)
          Path('/tmp/drpatil-v25-scripts.js').write_text('\n;\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          print('Flattened PDF integration injected without editing the original V25 source.')
          PY

      - name: Copy injected V25 web assets into Android project
        shell: bash
        run: |
          set -euo pipefail
          npx cap copy android
          WEB=android/app/src/main/assets/public
          test -s "$WEB/index.html"
          test -s "$WEB/html2canvas.min.js"
          test -s "$WEB/jspdf.umd.min.js"
          grep -q 'id="dr-patil-pdf-generator-v3"' "$WEB/index.html"
          grep -q 'AndroidPrint.sharePdf(base64' "$WEB/index.html"
          echo 'Verified: flattened PDF scripts and Android bridge copied into Android assets.'

      - name: Verify source preservation and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/drpatil-v25-scripts.js
          python3 - <<'PY'
          from pathlib import Path
          original=Path('DrPatil_Digital_OPD_V25_Final.html').read_text(encoding='utf-8')
          built=Path('www/index.html').read_text(encoding='utf-8')
          marker='<script id="dr-patil-pdf-generator-v3">'
          assert built.count(marker)==1,'PDF bridge script count is not one'
          start=built.index(marker);end=built.index('</script>',start)+len('</script>')
          stripped=built[:start]+built[end:]
          stripped=stripped.replace('<script src="html2canvas.min.js"></script>\n<script src="jspdf.umd.min.js"></script>\n','',1)
          stripped=stripped.replace('\n</body>','</body>',1)
          if stripped!=original: raise SystemExit('V25 source changed beyond the PDF additions')
          assert Path('www/html2canvas.min.js').is_file() and Path('www/jspdf.umd.min.js').is_file()
          print('V25 preservation and JavaScript syntax checks passed.')
          PY


      - name: Run Chromium PDF generation smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          cat > /tmp/drpatil-pdf-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 794, height: 1123 } });
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(e.message));
            await page.addInitScript(() => {
              window.AndroidPrint = {
                ping: () => 'DR_PATIL_PDF_BRIDGE_READY_V2',
                print: () => { window.__nativePrintCalled = true; },
                sharePdf: (encoded, patient) => { window.__sharedPdf = { encoded, patient }; }
              };
            });
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'load' });
            await page.waitForFunction(() => window.__drPatilPdfBridgeState === 'connected', null, { timeout: 30000 });
            await page.waitForFunction(() => typeof window.html2canvas === 'function' && !!(window.jspdf && window.jspdf.jsPDF), null, { timeout: 30000 });

            const routeInfo = await page.evaluate(() => ({
              consultationPrint: !!document.getElementById('print'),
              consultationShare: !!document.getElementById('share'),
              followupPrint: !!document.getElementById('printFollowup'),
              patientRecordPreviewRouteInSource: document.documentElement.innerHTML.includes('data-direct-preview'),
              followupHistoryPrintRouteInSource: document.documentElement.innerHTML.includes('data-print-fu'),
              preopPreviewRouteInSource: document.documentElement.innerHTML.includes('data-preop-preview')
            }));
            if (!Object.values(routeInfo).every(Boolean)) throw new Error('One or more V25 PDF routes are missing: ' + JSON.stringify(routeInfo));

            await page.evaluate(() => {
              const area = document.getElementById('printArea');
              area.innerHTML = '<section class="letter-page physical"><div class="letter-patient"><div class="v name">Physical Print Test</div></div><div class="letter-clinical"><h3>Clinical note</h3><p>Native print bridge smoke test.</p></div></section>';
              window._opdPrintMode = 'physical';
              window.print();
            });
            await page.waitForFunction(() => window.__nativePrintCalled === true, null, { timeout: 10000 });

            await page.evaluate(() => {
              const area = document.getElementById('printArea');
              area.innerHTML = '<section class="letter-page digital"><div class="letter-patient"><div class="v name">PDF Smoke Test</div><div class="v age">40 / M</div></div><div class="letter-clinical"><h3>Clinical note</h3><p>V25 digital PDF generation verification.</p></div><div class="letter-signature">Doctor signature</div></section>';
              window._opdPrintMode = 'digital';
              window.print();
            });
            await page.waitForFunction(() => !!window.__sharedPdf, null, { timeout: 60000 });
            const result = await page.evaluate(() => ({
              encoded: window.__sharedPdf.encoded,
              patient: window.__sharedPdf.patient,
              diagnostics: window.__drPatilPdfDiagnostics
            }));
            const pdf = Buffer.from(result.encoded, 'base64');
            if (pdf.subarray(0, 4).toString() !== '%PDF') throw new Error('PDF output does not have a valid PDF signature');
            if (pdf.length < 10000) throw new Error('Generated PDF is unexpectedly small: ' + pdf.length);
            require('fs').writeFileSync('/tmp/drpatil-generated-smoke.pdf', pdf);
            if (result.patient !== 'PDF Smoke Test') throw new Error('Patient name was not passed to the native share bridge');
            if (!result.diagnostics || !result.diagnostics.html2canvasLoaded || !result.diagnostics.jspdfLoaded) throw new Error('PDF library diagnostics failed');
            const capture = await page.evaluate(() => window.__drPatilLastPdfDiagnostics);
            if (!capture || capture.width < 500 || capture.height < 700 || capture.nonWhitePixelSampleCount < 10 || capture.pdfPages !== 1) throw new Error('Flattened capture checks failed: ' + JSON.stringify(capture));
            if (pageErrors.length) throw new Error('Browser JavaScript errors: ' + pageErrors.join(' | '));
            console.log('V25 PDF smoke test passed:', JSON.stringify({
              routes: routeInfo,
              pdfBytes: pdf.length,
              pdfHeader: pdf.subarray(0, 8).toString(),
              patient: result.patient,
              diagnostics: result.diagnostics, capture
            }));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          python3 -m http.server 4173 --directory www >/tmp/drpatil-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/drpatil-pdf-smoke.cjs
          python3 -m pip install --quiet pymupdf pillow
          python3 - <<'PY'
          import fitz
          from PIL import Image, ImageStat
          pdf=fitz.open('/tmp/drpatil-generated-smoke.pdf')
          if len(pdf)!=1: raise SystemExit(f'Expected one PDF page, got {len(pdf)}')
          page=pdf[0]; rect=page.rect
          if abs(rect.width-595.28)>2 or abs(rect.height-841.89)>2: raise SystemExit(f'PDF page is not A4: {rect}')
          pix=page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
          image=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
          if sum(ImageStat.Stat(image).stddev)<5: raise SystemExit('Rendered PDF is blank or nearly blank')
          if len(page.get_images(full=True))<1: raise SystemExit('PDF does not contain the flattened page image')
          print('Rendered PDF verified: one A4 page, embedded image, non-blank raster.')
          PY

      - name: Verify native PDF bridge configuration
        shell: bash
        run: |
          set -euo pipefail
          J=android/app/src/main/java/com/drpatil/digitalopd/MainActivity.java
          grep -q 'class MainActivity extends BridgeActivity' "$J"
          grep -q 'DR_PATIL_PDF_BRIDGE_READY_V2' "$J"
          grep -q 'void sharePdf(String encoded,String patient)' "$J"
          grep -q 'FileProvider.getUriForFile' "$J"
          grep -q 'androidx.core.content.FileProvider' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/file_paths.xml
          echo 'Native PDF creation/sharing checks passed.'

      - name: Build and integrity-check APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo 'APK created; archive integrity passed.'
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.drpatil.digitalopd'"
          "$APKSIGNER" verify "$APK"
          echo 'APK package ID and signature verified.'
          ls -lh "$APK"


      - name: Verify PDF integration inside the final APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          if not apk.is_file() or apk.stat().st_size == 0:
              raise SystemExit('Final APK is missing or empty')
          with ZipFile(apk) as z:
              names=set(z.namelist())
              html_path='assets/public/index.html'
              canvas_path='assets/public/html2canvas.min.js'
              jspdf_path='assets/public/jspdf.umd.min.js'
              if html_path not in names:
                  raise SystemExit('APK is missing packaged assets/public/index.html')
              if canvas_path not in names or jspdf_path not in names:
                  raise SystemExit('APK is missing html2canvas or jsPDF assets')
              html=z.read(html_path).decode('utf-8')
              required=[
                  'id="dr-patil-pdf-generator-v3"',
                  'html2canvas(page',
                  'pdf.addImage(img,\'JPEG\',0,0,210,297',
                  'DR_PATIL_PDF_BRIDGE_READY_V2',
                  'window.AndroidPrint.sharePdf(base64',
                  'window.AndroidPrint.print()'
              ]
              missing=[item for item in required if item not in html]
              if missing:
                  raise SystemExit('APK packaged HTML is missing PDF integration markers: '+', '.join(missing))
              canvas_lib=z.read(canvas_path)
              jspdf_lib=z.read(jspdf_path)
              if len(canvas_lib)<100000 or len(jspdf_lib)<100000:
                  raise SystemExit('Packaged PDF library is unexpectedly small')
              print('FINAL APK CONTENT VERIFICATION PASSED')
              print('Packaged HTML bytes:',len(html.encode('utf-8')))
              print('Packaged html2canvas bytes:',len(canvas_lib))
              print('Packaged jsPDF bytes:',len(jspdf_lib))
              print('PDF JavaScript and Android bridge calls are present in the actual APK.')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Patil-Digital-OPD-V25-Flattened-PDF
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
